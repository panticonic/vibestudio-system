clientDefaults:
  android: clients/mobile-browser
  desktop: clients/desktop-browser
  ios: clients/mobile-browser
  terminal: clients/terminal-browser
clients:
  - source: clients/desktop-browser
  - source: clients/mobile-browser
  - source: clients/terminal-browser
  - source: clients/chat-terminal
  - source: clients/chat-mobile
  - source: clients/chat-desktop
extensions:
  - source: extensions/typecheck-service
  - source: extensions/mobile-debug
  - source: extensions/react-native
  - source: extensions/local-models
minimumAppVersion: 0.1.105
runtimeExtensions:
  react-native:
    - extensions/react-native
services:
  - name: phone.provisioning
    source: workers/phone-provisioning
  - name: development
    source: workers/development
singletonObjects:
  - className: PhoneProvisioningDO
    key: workspace-phone-provisioning
    source: workers/phone-provisioning
  - className: DevelopmentDO
    key: workspace-development
    source: workers/development
systemEpoch: 0
template:
  dependencies:
    - url: git+https://github.com/panticonic/vibestudio-base.git
  description: Your private client applications and device settings.
  name: System
trust:
  clients:
    - clients/desktop-browser
    - clients/terminal-browser
    - clients/chat-terminal
    - clients/chat-mobile
    - clients/chat-desktop
    - clients/mobile-browser
